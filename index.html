<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>Futevôlei 2v2 — Praia</title>
    <meta name="description" content="Jogo de futevôlei 2 contra 2 na praia com física realista, jogável no navegador.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%;overflow:hidden;background:#0a1628;font-family:'Outfit',sans-serif}
        #c{display:block;margin:auto;image-rendering:auto;cursor:default}
        .tb{position:fixed;width:60px;height:60px;border-radius:50%;border:2px solid rgba(255,255,255,.35);
            background:rgba(255,255,255,.12);color:rgba(255,255,255,.55);font-size:22px;
            display:none;justify-content:center;align-items:center;touch-action:none;
            user-select:none;-webkit-user-select:none;z-index:10;pointer-events:auto}
        .tb:active{background:rgba(255,255,255,.3)}
        @media(pointer:coarse){.tb{display:flex}}
        #tl{bottom:20px;left:20px}
        #tr{bottom:20px;left:96px}
        #tj{bottom:20px;right:20px}
        #td{bottom:96px;right:20px}
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <div id="tl" class="tb">◀</div>
    <div id="tr" class="tb">▶</div>
    <div id="tj" class="tb">▲</div>
    <div id="td" class="tb">▼</div>
    <script src="game.js"></script>
</body>
</html>
